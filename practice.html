<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GED Prep — Math Practice</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#172033;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.wrap{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top a{color:#2563eb;text-decoration:none;font-weight:700}.hero{background:linear-gradient(135deg,#172554,#2563eb);color:#fff;border-radius:20px;padding:28px;margin-bottom:20px}.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;color:#dbeafe;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:18px;box-shadow:0 8px 20px rgba(15,23,42,.04);transition:.2s}.card:hover{transform:translateY(-3px);border-color:#9db8ef;box-shadow:0 14px 28px rgba(37,99,235,.08)}.num{font-size:12px;font-weight:900;color:#2563eb;text-transform:uppercase;letter-spacing:.08em}.title{font-weight:800;font-size:18px;margin:6px 0}.desc{color:#667085;font-size:13px;line-height:1.5;min-height:40px}.count{margin-top:12px;display:inline-block;padding:5px 8px;border-radius:999px;background:#eef4ff;color:#1d4ed8;font-size:12px;font-weight:800}.empty{opacity:.62}.footer{margin-top:26px;text-align:center;color:#8a94a6;font-size:13px}
</style></head>
<body>
<div class="wrap">
<div class="top"><a href="dashboard.html">← Dashboard</a><button onclick="gedSignOut()" style="border:0;background:none;color:#475467;cursor:pointer;font:inherit">Sign out</button></div>
<section class="hero"><h1>GED Mathematical Reasoning</h1><p>Choose a chapter. Questions, answers, explanations, difficulty, and math formatting are stored in the database, so new content can be added without changing the page.</p></section>
<div id="message" style="display:none;padding:12px 14px;border-radius:10px;background:#fff1f2;color:#9f1239;margin-bottom:15px"></div>
<section id="grid" class="grid"></section>
<div class="footer">© 2026 GED Prep — Created by Aung Naing Min</div>
</div>
<script>
const grid=document.getElementById("grid"),message=document.getElementById("message");
function show(t){message.textContent=t;message.style.display="block"}
async function load(){
 if(!GED_AUTH_READY)return show(GED_AUTH_ERROR);
 const user=await gedRequireUser();if(!user)return;await gedTouchProfile(user);
 const {data:chapters,error}=await gedSupabase.from("chapters").select("id,title,description,sort_order").order("sort_order");
 if(error)return show(error.message);
 const cards=await Promise.all((chapters||[]).map(async c=>{
   const {count}=await gedSupabase.from("questions").select("id",{count:"exact",head:true}).eq("chapter_id",c.id).eq("published",true);
   return {c,count:count||0};
 }));
 grid.innerHTML=cards.map(({c,count})=>'<a class="card '+(count?'':'empty')+'" href="quiz.html?chapter='+c.id+'"><div class="num">Chapter '+c.sort_order+'</div><div class="title">'+gedEscape(c.title)+'</div><div class="desc">'+gedEscape(c.description||"")+'</div><span class="count">'+count+' published question'+(count===1?'':'s')+'</span></a>').join("");
}
load();
</script>
</body></html>

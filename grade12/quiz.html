<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../auth.js"></script><script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['$$','$$'],['\\[','\\]']]},options:{processEscapes:true}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><title>Grade 12 Mathematics — Practice</title><style>body{font-family:Inter,ui-sans-serif,system-ui}.choice{transition:.15s}.choice:hover{transform:translateY(-1px)}</style></head><body class="bg-slate-50 text-slate-800"><header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b"><div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center"><a href="index.html" class="font-black text-indigo-600">← Grade 12 Math</a><span id="chapter" class="font-bold"></span></div></header><main class="max-w-5xl mx-auto p-4 sm:p-8"><div id="loading" class="py-20 text-center text-slate-500">Loading questions…</div><div id="app"></div></main><script>
let user,questions=[],answers={},chapterId=Number(new URLSearchParams(location.search).get("chapter")||1);
const $=id=>document.getElementById(id);const esc=v=>gedEscape(v);
function mathify(v){return String(v??"").replace(/\$(?!\d)(.*?)\$/gs,"\\($1\\)")}
async function typeset(){if(window.MathJax?.typesetPromise)await MathJax.typesetPromise()}
async function init(){if(!GED_AUTH_READY)return show("Authentication is not configured.");user=await gedRequireUser("login.html");if(!user)return;const [c,qs]=await Promise.all([gedSupabase.from("grade12_chapters").select("*").eq("id",chapterId).single(),gedSupabase.from("grade12_questions").select("*").eq("chapter_id",chapterId).eq("published",true).order("id")]);if(c.error)return show(c.error.message);$("chapter").textContent="Chapter "+c.data.sort_order+" · "+c.data.title;questions=qs.data||[];$("loading").remove();render()}
function show(t){$("loading").textContent=t}
function render(){if(!questions.length){$("app").innerHTML='<div class="bg-white rounded-3xl border p-10 text-center"><h2 class="text-2xl font-black">No questions yet</h2><p class="text-slate-500 mt-2">This chapter is ready. The administrator can add questions from the Admin page.</p></div>';return}
$("app").innerHTML='<div class="mb-6"><div class="text-sm text-slate-500">Answer the questions, then submit when ready.</div></div>'+questions.map((q,i)=>`<article class="bg-white rounded-3xl border shadow-sm p-6 mb-5"><div class="flex justify-between gap-3"><span class="text-xs font-black uppercase tracking-widest text-indigo-600">Question ${i+1}</span><span class="text-xs font-bold text-slate-400 uppercase">${esc(q.difficulty)}</span></div><div class="text-lg font-semibold leading-relaxed mt-4 math">${mathify(q.prompt)}</div><div class="grid sm:grid-cols-2 gap-3 mt-5">${(q.options||[]).map((o,j)=>`<button class="choice text-left border-2 rounded-2xl p-4 ${answers[i]===j?"border-indigo-500 bg-indigo-50":"border-slate-200"}" onclick="pick(${i},${j})"><b>${String.fromCharCode(65+j)}.</b> <span class="math">${mathify(o)}</span></button>`).join("")}</div><div id="exp-${i}" class="hidden mt-4 p-4 rounded-2xl bg-slate-50 text-slate-600 math"></div></article>`).join("")+`<button onclick="submitQuiz()" class="w-full py-4 rounded-2xl bg-indigo-600 text-white font-black text-lg">Submit & Save Result</button><div id="result" class="mt-5"></div>`;typeset()}
function pick(i,j){if(document.getElementById("result").innerHTML)return;answers[i]=j;render()}
async function submitQuiz(){const answered=Object.keys(answers).length;if(!answered)return alert("Please answer at least one question.");let score=0;questions.forEach((q,i)=>{if(answers[i]===q.correct_index)score++});const total=questions.length,pct=Math.round(score/total*100);const ins=await gedSupabase.from("grade12_attempts").insert({user_id:user.id,chapter_id:chapterId,score,total});if(ins.error)return alert(ins.error.message);questions.forEach((q,i)=>{const e=document.getElementById("exp-"+i);if(e){e.className="mt-4 p-4 rounded-2xl "+(answers[i]===q.correct_index?"bg-emerald-50 text-emerald-700":"bg-rose-50 text-rose-700")+" math";e.innerHTML=answers[i]===q.correct_index?"Correct — well done!":"Not quite. "+mathify(q.explanation||"Review this problem carefully.");}});document.getElementById("result").innerHTML=`<div class="p-6 rounded-3xl bg-indigo-600 text-white"><div class="text-sm uppercase tracking-widest opacity-80">Result</div><div class="text-4xl font-black mt-1">${score}/${total} · ${pct}%</div><div class="mt-2 opacity-85">${pct>=80?"Excellent work!":pct>=60?"Good progress — keep practicing.":"Keep practicing and review the explanations."}</div></div>`;typeset()}
init();
</script></body></html>

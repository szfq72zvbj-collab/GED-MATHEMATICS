<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../auth.js"></script><script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['$$','$$'],['\\[','\\]']]},options:{processEscapes:true}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><title>Grade 12 Mathematics — Sign In</title></head><body class="min-h-screen bg-gradient-to-br from-indigo-600 to-blue-600 flex items-center justify-center p-5"><main class="w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl"><div class="text-indigo-600 font-black text-2xl">∑ Grade 12 Math</div><h1 class="text-3xl font-black mt-5">Welcome back</h1><p class="text-slate-500 mt-2">Sign in to continue your Grade 12 practice.</p><div id="msg" class="hidden mt-5 p-4 rounded-xl text-sm"></div><form id="form" class="mt-6 space-y-4"><input id="email" required type="email" class="w-full px-4 py-3 border rounded-xl" placeholder="Email"><input id="password" required type="password" class="w-full px-4 py-3 border rounded-xl" placeholder="Password"><button class="w-full py-3 rounded-xl bg-indigo-600 text-white font-black">Sign in</button></form><div class="flex justify-between mt-5 text-sm"><a class="text-indigo-600 font-bold" href="reset.html">Forgot password?</a><a class="text-indigo-600 font-bold" href="signup.html">Create account</a></div></main><script>
function show(t){const m=document.getElementById("msg");m.textContent=t;m.className="mt-5 p-4 rounded-xl bg-rose-50 text-rose-700 text-sm"}
if(!GED_AUTH_READY)show(GED_AUTH_ERROR);
gedSupabase?.auth.getSession().then(({data})=>{if(data.session)location.href="index.html"});
document.getElementById("form").onsubmit=async e=>{e.preventDefault();if(!GED_AUTH_READY)return show(GED_AUTH_ERROR);const b=e.target.querySelector("button");b.disabled=true;b.textContent="Signing in…";const {error}=await gedSupabase.auth.signInWithPassword({email:email.value.trim(),password:password.value});b.disabled=false;b.textContent="Sign in";if(error)return show(error.message);location.href="index.html"}
</script></body></html>

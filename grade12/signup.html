<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../auth.js"></script><script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['$$','$$'],['\\[','\\]']]},options:{processEscapes:true}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><title>Grade 12 Mathematics — Create Account</title></head><body class="min-h-screen bg-slate-50 flex items-center justify-center p-5"><main class="w-full max-w-md bg-white rounded-3xl border p-8 shadow-xl"><div class="text-indigo-600 font-black text-2xl">∑ Grade 12 Math</div><h1 class="text-3xl font-black mt-5">Create your account</h1><p class="text-slate-500 mt-2">Create a real account to save your Grade 12 progress.</p><div id="msg" class="hidden mt-5 p-4 rounded-xl text-sm"></div><form id="form" class="mt-6 space-y-4"><input id="name" required class="w-full px-4 py-3 border rounded-xl" placeholder="Full name"><input id="email" required type="email" class="w-full px-4 py-3 border rounded-xl" placeholder="Email"><input id="password" required minlength="8" type="password" class="w-full px-4 py-3 border rounded-xl" placeholder="Password (8+ characters)"><button class="w-full py-3 rounded-xl bg-indigo-600 text-white font-black">Create account</button></form><p class="text-sm text-center mt-5">Already have an account? <a class="text-indigo-600 font-bold" href="login.html">Sign in</a></p></main><script>
function show(t,ok=false){const m=document.getElementById("msg");m.textContent=t;m.className="mt-5 p-4 rounded-xl text-sm "+(ok?"bg-emerald-50 text-emerald-700":"bg-rose-50 text-rose-700")}
document.getElementById("form").onsubmit=async e=>{e.preventDefault();if(!GED_AUTH_READY)return show(GED_AUTH_ERROR);const b=e.target.querySelector("button");b.disabled=true;b.textContent="Creating…";const {data,error}=await gedSupabase.auth.signUp({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value,options:{data:{full_name:document.getElementById("name").value.trim()}}});b.disabled=false;b.textContent="Create account";if(error)return show(error.message);if(data.session)location.href="index.html";else show("Account created. Check your email, then sign in.",true)}
</script></body></html>

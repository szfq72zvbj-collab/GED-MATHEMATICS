<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../auth.js"></script><script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['$$','$$'],['\\[','\\]']]},options:{processEscapes:true}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><title>Grade 12 Mathematics — New Password</title></head><body class="min-h-screen bg-slate-50 flex items-center justify-center p-5"><main class="w-full max-w-md bg-white rounded-3xl border p-8 shadow-xl"><h1 class="text-3xl font-black">Choose a new password</h1><div id="msg" class="hidden mt-5 p-4 rounded-xl text-sm"></div><form id="form" class="mt-6 space-y-4"><input id="password" required minlength="8" type="password" class="w-full px-4 py-3 border rounded-xl" placeholder="New password"><button class="w-full py-3 rounded-xl bg-indigo-600 text-white font-black">Update password</button></form></main><script>
function show(t,ok=false){const m=document.getElementById("msg");m.textContent=t;m.className="mt-5 p-4 rounded-xl text-sm "+(ok?"bg-emerald-50 text-emerald-700":"bg-rose-50 text-rose-700")}
document.getElementById("form").onsubmit=async e=>{e.preventDefault();if(!GED_AUTH_READY)return show(GED_AUTH_ERROR);if(password.value.length<8)return show("Password must be at least 8 characters.");const b=e.target.querySelector("button");b.disabled=true;const {error}=await gedSupabase.auth.updateUser({password:password.value});b.disabled=false;if(error)return show(error.message);show("Password updated successfully.",true)}
</script></body></html>

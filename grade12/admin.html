<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="../auth.js"></script><script>window.MathJax={tex:{inlineMath:[['\\(','\\)'],['$','$']],displayMath:[['$$','$$'],['\\[','\\]']]},options:{processEscapes:true}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script><title>Grade 12 Mathematics — Admin</title></head><body class="bg-slate-50 text-slate-800"><header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b"><div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between"><a href="index.html" class="font-black text-indigo-600">∑ Grade 12 Math Admin</a><a href="index.html" class="font-bold text-slate-600">Back to site</a></div></header><main class="max-w-7xl mx-auto p-4 sm:p-8"><div id="status" class="hidden mb-5 p-4 rounded-xl"></div><div class="grid lg:grid-cols-[300px_1fr] gap-6"><aside class="bg-white rounded-3xl border p-5"><h2 class="text-xl font-black">Chapters</h2><div id="chapters" class="mt-4 space-y-2"></div></aside><section class="bg-white rounded-3xl border p-5 sm:p-7"><div class="flex justify-between items-center"><div><h1 class="text-2xl font-black">Question Editor</h1><p class="text-sm text-slate-500 mt-1">Add your own Grade 12 questions. Use <code>\\(x^2\\)</code> or <code>$$x^2$$</code> for math.</p></div><button id="new" class="px-4 py-2 rounded-xl bg-slate-100 font-bold">New</button></div><div id="list" class="mt-5"></div><form id="form" class="mt-7 space-y-4"><input type="hidden" id="id"><select id="chapter" required class="w-full px-4 py-3 border rounded-xl"></select><textarea id="prompt" required class="w-full px-4 py-3 border rounded-xl min-h-28" placeholder="Question"></textarea><div class="grid sm:grid-cols-2 gap-3"><input id="a" required class="px-4 py-3 border rounded-xl" placeholder="Option A"><input id="b" required class="px-4 py-3 border rounded-xl" placeholder="Option B"><input id="c" required class="px-4 py-3 border rounded-xl" placeholder="Option C"><input id="d" required class="px-4 py-3 border rounded-xl" placeholder="Option D"></div><select id="correct" class="w-full px-4 py-3 border rounded-xl"><option value="0">Correct: A</option><option value="1">Correct: B</option><option value="2">Correct: C</option><option value="3">Correct: D</option></select><textarea id="explanation" class="w-full px-4 py-3 border rounded-xl min-h-24" placeholder="Explanation"></textarea><select id="difficulty" class="w-full px-4 py-3 border rounded-xl"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select><label class="flex items-center gap-2"><input id="published" type="checkbox" checked> Published</label><div class="flex gap-3"><button class="px-5 py-3 rounded-xl bg-indigo-600 text-white font-black">Save Question</button><button type="button" id="del" class="hidden px-5 py-3 rounded-xl bg-rose-600 text-white font-black">Delete</button></div><div class="mt-5 p-4 rounded-2xl bg-slate-50"><b>Math preview</b><div id="preview" class="mt-2 math"></div></div></form></section></div></main><script>
let chapters=[],active=1,editing=null;const $=id=>document.getElementById(id);const esc=v=>gedEscape(v);function msg(t,ok=false){$("status").textContent=t;$("status").className="mb-5 p-4 rounded-xl "+(ok?"bg-emerald-50 text-emerald-700":"bg-rose-50 text-rose-700")}
function mathify(v){return String(v??"").replace(/\$(?!\d)(.*?)\$/gs,"\\($1\\)")}async function typeset(){if(window.MathJax?.typesetPromise)await MathJax.typesetPromise()}
async function init(){if(!GED_AUTH_READY)return msg(GED_AUTH_ERROR);const u=await gedRequireUser("login.html");if(!u)return;const p=await gedSupabase.from("profiles").select("role").eq("id",u.id).single();if(p.data?.role!=="admin")return msg("Administrator access required.");const c=await gedSupabase.from("grade12_chapters").select("*").order("sort_order");if(c.error)return msg(c.error.message);chapters=c.data||[];$("chapter").innerHTML=chapters.map(c=>`<option value="${c.id}">Ch ${c.id} · ${esc(c.title)}</option>`).join("");$("chapters").innerHTML=chapters.map(c=>`<button class="w-full text-left p-3 rounded-xl border hover:border-indigo-400" onclick="load(${c.id})"><b>Ch ${c.id}</b><div class="text-sm text-slate-500">${esc(c.title)}</div><span id="count-${c.id}" class="text-xs text-slate-400">Loading…</span></button>`).join("");for(const c of chapters)await count(c.id);await load(chapters[0]?.id||1)}
async function count(id){const r=await gedSupabase.from("grade12_questions").select("id",{count:"exact",head:true}).eq("chapter_id",id);$("count-"+id).textContent=(r.count??0)+" questions"}
async function load(id){active=id;$("chapter").value=id;const r=await gedSupabase.from("grade12_questions").select("id,prompt,difficulty,published").eq("chapter_id",id).order("id");if(r.error)return msg(r.error.message);$("list").innerHTML=(r.data||[]).length?(r.data||[]).map(q=>`<button type="button" onclick="edit(${q.id})" class="block w-full text-left p-3 rounded-xl border mb-2 hover:border-indigo-400"><b>Q${q.id}</b> · ${esc(q.prompt.replace(/\\\(|\\\)|\$|\$\$/g,"").slice(0,100))}<div class="text-xs text-slate-400 mt-1">${esc(q.difficulty)} · ${q.published?"Published":"Draft"}</div></button>`).join(""):'<p class="text-sm text-slate-400">No questions yet. Add one below.</p>'}
function clear(){editing=null;$("id").value="";["prompt","a","b","c","d","explanation"].forEach(x=>$(x).value="");$("correct").value=0;$("difficulty").value="medium";$("published").checked=true;$("del").classList.add("hidden");updatePreview()}
async function edit(id){const r=await gedSupabase.from("grade12_questions").select("*").eq("id",id).single();if(r.error)return msg(r.error.message);const q=r.data;editing=q.id;$("id").value=q.id;$("chapter").value=q.chapter_id;$("prompt").value=q.prompt;["a","b","c","d"].forEach((x,i)=>$(x).value=q.options?.[i]||"");$("correct").value=q.correct_index;$("explanation").value=q.explanation||"";$("difficulty").value=q.difficulty;$("published").checked=q.published;$("del").classList.remove("hidden");updatePreview();window.scrollTo({top:0,behavior:"smooth"})}
function updatePreview(){$("preview").innerHTML=mathify($("prompt").value)+"<div class='mt-2'>A. "+mathify($("a").value)+"<br>B. "+mathify($("b").value)+"<br>C. "+mathify($("c").value)+"<br>D. "+mathify($("d").value)+"</div><hr>"+mathify($("explanation").value);typeset()}
$("form").onsubmit=async e=>{e.preventDefault();const payload={chapter_id:Number($("chapter").value),prompt:$("prompt").value.trim(),options:[$("a").value.trim(),$("b").value.trim(),$("c").value.trim(),$("d").value.trim()],correct_index:Number($("correct").value),explanation:$("explanation").value.trim(),difficulty:$("difficulty").value,published:$("published").checked,created_by:(await gedSupabase.auth.getUser()).data.user.id};const r=editing?await gedSupabase.from("grade12_questions").update(payload).eq("id",editing):await gedSupabase.from("grade12_questions").insert(payload);if(r.error)return msg(r.error.message);msg("Question saved.",true);const ch=payload.chapter_id;clear();await load(ch);await count(ch)}
$("new").onclick=clear;$("del").onclick=async()=>{if(!editing||!confirm("Delete this question?"))return;const r=await gedSupabase.from("grade12_questions").delete().eq("id",editing);if(r.error)return msg(r.error.message);msg("Question deleted.",true);clear();await load(active);await count(active)};["prompt","a","b","c","d","explanation"].forEach(x=>$(x).oninput=updatePreview);init();
</script></body></html>

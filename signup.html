<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GED Prep — Create Account</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef4ff,#f8fafc);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;display:grid;place-items:center;padding:24px}
.card{width:min(480px,100%);background:#fff;border:1px solid #e5eaf2;border-radius:22px;padding:34px;box-shadow:0 24px 70px rgba(15,23,42,.10)}
.logo{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;letter-spacing:.04em;margin-bottom:18px}
h1{margin:0 0 8px;font-size:30px}p{color:#667085;line-height:1.55}.field{margin:18px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:8px}.field input{width:100%;padding:13px 14px;border:1px solid #d7deea;border-radius:10px;font:inherit}.field input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.10)}
button{width:100%;padding:14px;border:0;border-radius:11px;background:#2563eb;color:#fff;font-weight:800;font-size:15px;cursor:pointer}.msg{margin:16px 0;padding:12px 14px;border-radius:10px;display:none;font-size:14px}.msg.show{display:block}.err{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}.foot{text-align:center;margin-top:20px;font-size:14px}.foot a{color:#2563eb;font-weight:700;text-decoration:none}
.small{font-size:12px;color:#8a94a6;margin-top:10px}
</style></head>
<body>
<main class="card">
<div class="logo">GED</div>
<h1>Create your account</h1>
<p>Save your GED practice progress, keep your quiz history, and continue where you left off.</p>
<div id="message" class="msg"></div>
<form id="signup">
<div class="field"><label for="name">Full name</label><input id="name" required autocomplete="name" placeholder="Your full name"></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div>
<button id="submit" type="submit">Create Account</button>
</form>
<div class="small">You may need to confirm your email, depending on your Supabase Auth settings.</div>
<div class="foot">Already have an account? <a href="index.html">Sign in</a></div>
<a class="foot" style="display:block;margin-top:10px" href="grade12/index.html">← Back to Grade 12 Mathematics</a>
</main>
<script>
const msg=document.getElementById("message");
function show(text,kind){msg.textContent=text;msg.className="msg show "+kind}
if(!GED_AUTH_READY){
 show(GED_AUTH_ERROR,"err");
 document.getElementById("signup").querySelector("button").disabled=true;
}
const nextPage=new URLSearchParams(window.location.search).get("next");
document.getElementById("signup").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!GED_AUTH_READY)return show(GED_AUTH_ERROR,"err");
 const button=document.getElementById("submit");
 button.disabled=true;button.textContent="Creating account…";
 const email=document.getElementById("email").value.trim();
 const name=document.getElementById("name").value.trim();
 const password=document.getElementById("password").value;
 if(!name)return show("Please enter your full name.","err");
 if(!email)return show("Please enter a valid email address.","err");
 if(password.length<8)return show("Password must be at least 8 characters.","err");
 const {data,error}=await gedSupabase.auth.signUp({
   email,
   password,
   options:{data:{full_name:name}}
 });
 button.disabled=false;button.textContent="Create Account";
 if(error){
   let message=error.message||"Unable to create the account.";
   if(/Database error saving new user/i.test(message)){
     message += " Make sure supabase/schema.sql has been run in your Supabase SQL Editor.";
   } else if(/redirect url/i.test(message)){
     message += " Check the Supabase Auth URL Configuration and add your deployed website URL.";
   } else if(/already registered|already been registered|user already exists/i.test(message)){
     message = "An account with this email already exists. Use Sign in or Forgot password.";
   }
   return show(message,"err");
 }
 if(data.session){
   window.location.replace(nextPage==="grade12"?"grade12/index.html":"dashboard.html");
 } else if(nextPage==="grade12"){
   // Hosted Supabase projects normally require email confirmation.
   // Open the Grade 12 site immediately and show the confirmation message there.
   window.location.replace("grade12/index.html?signup=success");
 } else {
   show("Account created successfully. Check your email to confirm the account, then return here and sign in.","ok");
 }
});
</script>
</body></html>

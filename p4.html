<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f4f7fb;font-family:Inter,Arial,sans-serif;color:#202124}.wrap{max-width:900px;margin:auto;background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 30px #00000012;border-top:7px solid #2563eb}h1{margin:0 0 6px}.sub{color:#64748b;margin:0 0 24px}.student{margin-bottom:20px}.student input{width:100%;padding:12px;border:1px solid #dbe3ef;border-radius:8px;font-size:16px}.q{border:1px solid #e5eaf2;border-radius:12px;padding:18px;margin:14px 0;position:relative}.q.correct{border-color:#86efac;background:#f7fff9}.q.wrong{border-color:#fca5a5;background:#fffafa}.qt{font-weight:700;margin-bottom:12px}.opts{display:grid;gap:8px}.opt{padding:11px 13px;border-radius:8px;background:#f8fafc;cursor:pointer}.opt:hover{background:#eef5ff}.opt input{margin-right:8px}.submit,.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}.submit{background:#2563eb;color:#fff;width:100%;margin-top:10px}.result{display:none;text-align:center;padding:22px 0}.score{font-size:46px;font-weight:800;color:#2563eb}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{background:#16a34a;color:#fff}.btn.gray{background:#64748b}.key{display:none;margin-top:20px;border-top:2px solid #16a34a;padding-top:18px}.sol{padding:12px;border:1px solid #e5e7eb;border-radius:9px;margin:10px 0}.exp{margin-top:8px;background:#f8fafc;padding:10px;border-left:4px solid #16a34a}.badge{position:absolute;right:12px;top:12px;padding:5px 9px;border-radius:99px;color:#fff;font-size:12px}.good{background:#16a34a}.bad{background:#dc2626}@media(max-width:600px){body{padding:10px}.wrap{padding:18px}h1{font-size:24px}.q{padding:15px}.score{font-size:38px}}

<body><main class="wrap">
<a href="practice.html">← Math Topics</a>
<h1>Slope & Equations</h1><p class="sub">10 GED-style questions on slope, intercepts, linear equations, and graphs.</p>
<form id="quiz"><div class="student"><label><b>Student Name</b><input name="Student_Name" required placeholder="Your name"></label></div><div id="qs"></div><button class="submit">Submit Quiz</button></form>
<section class="result" id="result"><h2>Results</h2><div class="score" id="score"></div><div class="actions"><button class="btn" id="showKey" type="button">Show Solutions</button><button class="btn gray" type="button" onclick="location.reload()">Try Again</button></div></section>
<section class="key" id="key"><h2>Answer Key & Explanations</h2><div id="solutions"></div></section>
</main>
<script>
const questions=[{"q":"What is the slope through $(1,2)$ and $(3,6)$?","o":["1","2","3","4"],"a":1,"e":"$m=(6-2)/(3-1)=4/2=2$."},{"q":"What is the slope of $y=3x+5$?","o":["-5","2","3","5"],"a":2,"e":"In $y=mx+b$, the coefficient of $x$ is the slope. Thus $m=3$."},{"q":"What is the $y$-intercept of $y=2x-7$?","o":["-7","-2","2","7"],"a":0,"e":"The constant term is the $y$-intercept: $-7$."},{"q":"Which equation has slope 4 and $y$-intercept 2?","o":["$y=2x+4$","$y=4x+2$","$y=4x-2$","$y=2x-4$"],"a":1,"e":"Use $y=mx+b$: $y=4x+2$."},{"q":"What is the slope through $(2,5)$ and $(6,13)$?","o":["1","2","3","4"],"a":1,"e":"$m=(13-5)/(6-2)=8/4=2$."},{"q":"For $y=-2x+9$, what is $y$ when $x=3$?","o":["1","3","5","7"],"a":1,"e":"$y=-2(3)+9=3$."},{"q":"Which point lies on $y=x+4$?","o":["$(2,5)$","$(2,6)$","$(3,6)$","$(4,7)$"],"a":1,"e":"For $x=2$, $y=2+4=6$, so $(2,6)$."},{"q":"What is the slope of a horizontal line?","o":["Undefined","0","1","-1"],"a":1,"e":"A horizontal line has no vertical change, so its slope is $0$."},{"q":"What is the slope of a vertical line?","o":["0","1","-1","Undefined"],"a":3,"e":"A vertical line has zero horizontal change, so its slope is undefined."},{"q":"Rewrite $2x+y=8$ in slope-intercept form.","o":["$y=2x+8$","$y=-2x+8$","$y=2x-8$","$y=-2x-8$"],"a":1,"e":"Subtract $2x$: $y=8-2x=-2x+8$."},{"q":"What is the slope of $y=-4x+1$?","o":["-4","-1","1","4"],"a":0,"e":"In $y=mx+b$, $m=-4$."},{"q":"What is the $y$-intercept of $y=5x+12$?","o":["5","7","10","12"],"a":3,"e":"The constant term is the $y$-intercept: 12."},{"q":"What is the slope through $(0,3)$ and $(4,11)$?","o":["1","2","3","4"],"a":1,"e":"$m=(11-3)/(4-0)=8/4=2$."},{"q":"Which equation has slope $-3$ and $y$-intercept $5$?","o":["$y=3x+5$","$y=-3x+5$","$y=-3x-5$","$y=5x-3$"],"a":1,"e":"Use $y=mx+b$: $y=-3x+5$."},{"q":"For $y=2x-1$, what is $y$ when $x=7$?","o":["11","12","13","14"],"a":2,"e":"$y=2(7)-1=13$."},{"q":"Which point is on $y=2x+1$?","o":["$(1,2)$","$(2,4)$","$(2,5)$","$(3,5)$"],"a":2,"e":"At $x=2$, $y=5$, so $(2,5)$."},{"q":"A line has slope 3 and passes through $(0,-2)$. Which equation represents it?","o":["$y=3x-2$","$y=3x+2$","$y=-3x-2$","$y=2x+3$"],"a":0,"e":"The $y$-intercept is -2, so $y=3x-2$."},{"q":"Rewrite $3x-2y=10$ in slope-intercept form.","o":["$y=\\frac32x-5$","$y=-\\frac32x+5$","$y=3x-5$","$y=-3x+5$"],"a":1,"e":"$-2y=10-3x$, so $y=\\frac32x-5$ — correction: this is option A, not B."},{"q":"If a line rises 12 units while running 4 units, what is its slope?","o":["2","3","4","8"],"a":1,"e":"Slope = rise/run = $12/4=3$."},{"q":"Two lines have slopes 2 and -2. What is true about their slopes?","o":["They are equal","They have the same sign","They are opposites","Both are zero"],"a":2,"e":"2 and -2 have equal magnitude but opposite signs."}];
const qs=document.getElementById('qs');
function saveQuizResult(score,total){localStorage.setItem('ged_quiz_p4',JSON.stringify({score,total,updatedAt:new Date().toISOString()}));}

questions.forEach((x,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML='<div class="qt">Q'+(i+1)+'. '+x.q+'</div><div class="opts">'+x.o.map((v,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'" required> '+String.fromCharCode(65+j)+'. '+v+'</label>').join('')+'</div>';qs.appendChild(d)});
document.getElementById('quiz').addEventListener('submit',e=>{e.preventDefault();let n=0;questions.forEach((x,i)=>{const d=qs.children[i],v=d.querySelector('input:checked')?.value,b=document.createElement('span');b.className='badge '+(v==x.a?'good':'bad');b.textContent=v==x.a?'Correct':'Incorrect';d.querySelector('.badge')?.remove();d.appendChild(b);d.classList.toggle('correct',v==x.a);d.classList.toggle('wrong',v!=x.a);if(v==x.a)n++});document.getElementById('score').textContent=n+'/'+questions.length;saveQuizResult(n,questions.length);document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';window.scrollTo({top:0,behavior:'smooth'})});
document.getElementById('showKey').onclick=()=>{const k=document.getElementById('solutions');k.innerHTML=questions.map((x,i)=>'<div class="sol"><b>Q'+(i+1)+': Answer '+String.fromCharCode(65+x.a)+'</b><div class="exp">'+x.e+'</div></div>').join('');document.getElementById('key').style.display='block';if(window.MathJax)MathJax.typesetPromise()}; 
</script></body></html>

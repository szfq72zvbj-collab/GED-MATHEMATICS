<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GED Math — Mixed Practice</title>
<script>MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']]}};</script><script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
body{font-family:Inter,'Segoe UI',Arial,sans-serif;background:linear-gradient(180deg,#eef6ff,#f7f9fb);padding:20px;color:#202124}.container{max-width:900px;margin:auto;background:#fff;border-radius:14px;border-top:8px solid #1a73e8;padding:30px;box-shadow:0 6px 24px rgba(18,40,80,.08)}h1{margin:0 0 6px}.subtitle{color:#5f6368;margin-bottom:24px}.question{border:1px solid #e6eefc;border-radius:10px;padding:20px;margin-bottom:16px;position:relative}.question.correct{border-color:#b7e4c7}.question.incorrect{border-color:#ffcaca}.question-text{font-weight:600;margin-bottom:14px}.options{list-style:none;padding:0;margin:0}.options li{margin:8px 0}.option-label{display:block;padding:10px 12px;border-radius:8px;cursor:pointer}.option-label:hover{background:#f6fbff}.correct-label{background:#e9f8ee}.selected-wrong{background:#fff1f1}input[type=radio]{margin-right:10px}input[type=text]{width:100%;border:0;border-bottom:1px solid #dadce0;padding:9px 0;font-size:16px;outline:0}.submit{background:#1a73e8;color:#fff;border:0;border-radius:8px;padding:13px 20px;font-weight:600;cursor:pointer;width:100%;font-size:16px}#result{display:none;text-align:center;padding:20px}.score{font-size:46px;font-weight:700;color:#1a73e8}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 16px;background:#34a853;color:#fff;cursor:pointer}.solution{border:1px solid #e6eefc;border-radius:9px;padding:14px;margin:10px 0;text-align:left}.explanation{background:#f8f9fa;border-left:4px solid #34a853;padding:10px;margin-top:8px}.badge{position:absolute;right:14px;top:12px;padding:5px 9px;border-radius:20px;color:#fff;font-size:12px}.badge.correct{background:#16a34a}.badge.incorrect{background:#ef4444}footer{text-align:center;color:#777;font-size:13px;margin-top:28px}@media(max-width:600px){.container{padding:20px}h1{font-size:24px}.question{padding:16px}.score{font-size:38px}}
</style></head><body><div class="container">
<a href="practice.html">← Back to Practice Sets</a><div id="quizHeader"><h1>GED Mixed Math Practice</h1><p class="subtitle">15 GED-style questions covering algebra, ratios, percentages, geometry, statistics, probability, and word problems.</p></div>
<form id="quizForm"><div class="question"><div class="question-text">Student Name <span style="color:red">*</span></div><input type="text" name="Student_Name" required placeholder="Your full name"></div><div id="questions"></div><button class="submit" type="submit">Submit for Grading</button></form>
<div id="result"><h2>Practice Results</h2><div class="score" id="score">0/15</div><div class="controls"><button class="btn" type="button" id="wrong">Review Mistakes</button><button class="btn" type="button" id="all" style="background:#1a73e8">Show All Solutions</button><button class="btn" type="button" onclick="location.reload()" style="background:#64748b">Try Again</button></div></div>
<div id="solutions" style="display:none"><h2>Step-by-Step Solutions</h2><div id="solutionList"></div></div><footer>© 2026 GED Prep — Created by <strong>Aung Naing Min</strong>.</footer></div>
<script>
const questions=[
{q:'A jacket originally costs $80 and is discounted by 25%. What is the sale price?',o:['$20','$55','$60','$75'],a:2,e:'25% of $80 is $20. Subtract $20 from $80: $60.'},
{q:'Solve: $3x+7=25$.',o:['4','6','8','10'],a:1,e:'Subtract 7: $3x=18$. Divide by 3: $x=6$.'},
{q:'A recipe uses 3 cups of flour for 8 servings. How much flour is needed for 20 servings?',o:['6 cups','7.5 cups','8 cups','9 cups'],a:1,e:'Set up $3/8=x/20$. Thus $x=60/8=7.5$ cups.'},
{q:'What is the area of a rectangle 12 cm long and 7 cm wide?',o:['19 cm²','38 cm²','84 cm²','168 cm²'],a:2,e:'Area = length × width = $12×7=84$ cm².'},
{q:'The mean of 6, 8, 10, 12, and $x$ is 10. What is $x$?',o:['10','12','14','16'],a:2,e:'The total must be $5×10=50$. The first four total 36, so $x=14$.'},
{q:'A bag contains 3 red, 5 blue, and 2 green marbles. What is the probability of selecting a red marble?',o:['1/5','3/10','1/3','3/5'],a:1,e:'There are 10 marbles total and 3 are red, so the probability is $3/10$.'},
{q:'Which expression is equivalent to $2(x+4)-3$?',o:['$2x+1$','$2x+5$','$2x+8$','$2x-1$'],a:1,e:'Distribute 2: $2x+8-3=2x+5$.'},
{q:'A car travels 180 miles in 3 hours. What is its average speed?',o:['50 mph','60 mph','70 mph','90 mph'],a:1,e:'Speed = distance ÷ time = $180÷3=60$ mph.'},
{q:'What is the slope of the line through $(2,3)$ and $(6,11)$?',o:['1/2','2','4','8'],a:1,e:'Slope = $(11-3)/(6-2)=8/4=2$.'},
{q:'A right triangle has legs of 6 and 8. What is the length of its hypotenuse?',o:['9','10','12','14'],a:1,e:'By the Pythagorean theorem, $c=\\sqrt{6^2+8^2}=\\sqrt{100}=10$.'},
{q:'If $y=2x-5$, what is $y$ when $x=7$?',o:['7','8','9','10'],a:2,e:'Substitute 7: $y=2(7)-5=9$.'},
{q:'A $60 increase on a $240 item is what percent of the original price?',o:['15%','20%','25%','30%'],a:2,e:'$60/240=0.25=25%$.'},
{q:'Which value is greatest?',o:['0.62','$5/8$','61%','0.605'],a:1,e:'$5/8=0.625$, which is greater than 0.62, 0.61, and 0.605.'},
{q:'A circle has radius 5 cm. Using $\\pi\\approx3.14$, what is its area?',o:['15.7 cm²','31.4 cm²','62.8 cm²','78.5 cm²'],a:3,e:'Area = $\\pi r^2=3.14(25)=78.5$ cm².'},
{q:'A store marks an item from $50 to $65. What is the percent increase?',o:['15%','20%','25%','30%'],a:3,e:'Increase = $15$. Then $15/50=0.30$, or 30%.'}
];
const box=document.getElementById('questions');
questions.forEach((x,i)=>{const d=document.createElement('div');d.className='question';d.innerHTML='<div class="question-text">Q'+(i+1)+'. '+x.q+'</div><ul class="options">'+x.o.map((v,j)=>'<li><label class="option-label"><input type="radio" name="q'+i+'" value="'+j+'" required> '+v+'</label></li>').join('')+'</ul>';box.appendChild(d)});
if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise();
const form=document.getElementById('quizForm');
form.addEventListener('submit',e=>{e.preventDefault();let score=0;questions.forEach((x,i)=>{const d=box.children[i],sel=Number(form.elements['q'+i].value);d.querySelectorAll('.badge').forEach(b=>b.remove());d.querySelectorAll('label').forEach(l=>l.classList.remove('correct-label','selected-wrong'));d.querySelectorAll('input').forEach(inp=>{if(Number(inp.value)===x.a)inp.parentElement.classList.add('correct-label');if(inp.checked&&Number(inp.value)!==x.a)inp.parentElement.classList.add('selected-wrong')});const b=document.createElement('span');b.className='badge '+(sel===x.a?'correct':'incorrect');b.textContent=sel===x.a?'Correct':'Incorrect';d.appendChild(b);d.classList.toggle('correct',sel===x.a);d.classList.toggle('incorrect',sel!==x.a);if(sel===x.a)score++});document.getElementById('score').textContent=score+'/15';document.getElementById('result').style.display='block';buildSolutions('all');window.scrollTo({top:0,behavior:'smooth'})});
function buildSolutions(filter){const list=document.getElementById('solutionList');list.innerHTML='';questions.forEach((x,i)=>{const selected=Number(form.elements['q'+i].value);if(filter==='wrong'&&selected===x.a)return;const d=document.createElement('div');d.className='solution';d.innerHTML='<strong>Q'+(i+1)+':</strong> '+x.o[x.a]+'<div class="explanation">'+x.e+'</div>';list.appendChild(d)});document.getElementById('solutions').style.display='block';if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise()};document.getElementById('all').onclick=()=>buildSolutions('all');document.getElementById('wrong').onclick=()=>buildSolutions('wrong');
</script></body></html>

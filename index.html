<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>GED Prep — Sign In</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <style>
    /* Modern Color Palette with Glassmorphism */
    :root {
      --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --container-bg: rgba(255, 255, 255, 0.95);
      --primary: #7c3aed;
      --primary-dark: #6d28d9;
      --primary-light: #8b5cf6;
      --accent: #10b981;
      --text: #1f2937;
      --text-light: #6b7280;
      --text-muted: #9ca3af;
      --border: rgba(209, 213, 219, 0.5);
      --border-light: rgba(243, 244, 246, 0.8);
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.1), 0 10px 20px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 30px 60px rgba(0, 0, 0, 0.15), 0 15px 30px rgba(0, 0, 0, 0.1);
      --error: #ef4444;
      --error-light: rgba(254, 242, 242, 0.8);
      --success: #10b981;
      --success-light: rgba(240, 253, 244, 0.8);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-lg: 24px;
      --glass: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
      backdrop-filter: blur(10px);
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: var(--container-bg);
      border-radius: var(--radius-lg);
      padding: 56px 48px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--glass-border);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(20px);
      animation: fadeIn 0.8s ease-out;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
      animation: slideIn 1s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideIn {
      from {
        transform: translateX(-100%);
      }
      to {
        transform: translateX(0);
      }
    }

    header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeInUp 0.6s ease-out 0.2s both;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.25);
      transform: rotate(0deg);
      transition: transform 0.5s ease;
    }

    .logo-icon:hover {
      transform: rotate(10deg);
    }

    header h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--text-light);
      font-size: 16px;
      line-height: 1.7;
      max-width: 340px;
      margin: 0 auto;
      opacity: 0.9;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group {
      margin-bottom: 28px;
      position: relative;
      animation: fadeInUp 0.6s ease-out 0.4s both;
    }

    .form-group:nth-child(2) {
      animation-delay: 0.5s;
    }

    .form-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      letter-spacing: -0.01em;
      text-transform: uppercase;
      font-size: 13px;
      opacity: 0.8;
    }

    .form-control {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-family: inherit;
      transition: all 0.3s ease;
      background-color: rgba(255, 255, 255, 0.9);
      color: var(--text);
      backdrop-filter: blur(10px);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
      transform: translateY(-2px);
      background-color: white;
    }

    .form-control:hover:not(:focus) {
      border-color: var(--primary-light);
      transform: translateY(-1px);
    }

    .form-control.error {
      border-color: var(--error);
      background-color: var(--error-light);
      animation: shake 0.5s ease-in-out;
    }

    .error-message {
      color: var(--error);
      font-size: 14px;
      margin-top: 8px;
      display: none;
      font-weight: 500;
      padding-left: 4px;
    }

    .error-message.show {
      display: block;
      animation: fadeIn 0.3s ease-out;
    }

    .password-toggle {
      position: absolute;
      right: 20px;
      top: 42px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 6px;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 4px;
      z-index: 2;
    }

    .password-toggle:hover {
      color: var(--primary);
      background: rgba(124, 58, 237, 0.1);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 36px;
      font-size: 15px;
      animation: fadeInUp 0.6s ease-out 0.5s both;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .remember input[type="checkbox"] {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: all 0.3s;
      appearance: none;
      position: relative;
      background: rgba(255, 255, 255, 0.9);
    }

    .remember input[type="checkbox"]:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .remember input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    .remember input[type="checkbox"]:hover {
      border-color: var(--primary-light);
      transform: scale(1.1);
    }

    .remember label {
      color: var(--text-light);
      cursor: pointer;
      user-select: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .remember:hover label {
      color: var(--text);
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
      position: relative;
      padding-bottom: 2px;
    }

    .forgot-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: width 0.3s;
    }

    .forgot-link:hover {
      color: var(--primary-dark);
    }

    .forgot-link:hover::after {
      width: 100%;
    }

    .btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      border: none;
      padding: 18px 28px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      letter-spacing: 0.02em;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.6s ease-out 0.6s both;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.2);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 1;
    }

    .btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn:hover::before {
      opacity: 1;
    }

    .btn:hover::after {
      width: 300px;
      height: 300px;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.3);
    }

    .btn:active {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.2);
    }

    .btn span {
      position: relative;
      z-index: 2;
    }

    .btn:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn:disabled::before,
    .btn:disabled::after {
      display: none;
    }
    
    /* Mobile Touch Improvements */
    @media (hover: none) and (pointer: coarse) {
      .btn, .password-toggle {
        min-height: 44px;
      }
      
      .form-control {
        min-height: 44px;
      }
      
      .forgot-link, .signup-link a {
        padding: 8px 0;
        display: inline-block;
      }
      
      /* Remove hover effects on touch devices */
      .btn:hover, .form-control:hover:not(:focus) {
        transform: none;
      }
      
      .btn:active {
        transform: scale(0.98);
      }
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 40px 0;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      animation: fadeInUp 0.6s ease-out 0.7s both;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    .divider span {
      padding: 0 20px;
      opacity: 0.7;
    }

    .signup-link {
      text-align: center;
      margin-top: 36px;
      font-size: 15px;
      color: var(--text-light);
      animation: fadeInUp 0.6s ease-out 0.9s both;
    }

    .signup-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      transition: all 0.3s;
      position: relative;
      padding-bottom: 2px;
    }

    .signup-link a::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: width 0.3s;
    }

    .signup-link a:hover {
      color: var(--primary-dark);
    }

    .signup-link a:hover::after {
      width: 100%;
    }

    .message {
      padding: 20px;
      border-radius: var(--radius-sm);
      margin-bottom: 28px;
      font-size: 15px;
      display: none;
      animation: slideIn 0.4s ease-out;
      border-left: 5px solid transparent;
      backdrop-filter: blur(10px);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-15px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message.success {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(16, 185, 129, 0.05) 100%);
      border-color: var(--success);
      color: #065f46;
      display: block;
      border: 2px solid rgba(16, 185, 129, 0.2);
    }

    .message.info {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.08) 0%, rgba(37, 99, 235, 0.03) 100%);
      border-color: rgba(37, 99, 235, 0.25);
      color: #1e3a8a;
      display: block;
      border: 2px solid rgba(37, 99, 235, 0.18);
    }

    .message.error {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(239, 68, 68, 0.05) 100%);
      border-color: var(--error);
      color: #7f1d1d;
      display: block;
      border: 2px solid rgba(239, 68, 68, 0.2);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s;
      padding: 10px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
    }

    .back-link:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.95);
      transform: translateX(-5px);
    }

    .back-link::before {
      content: '←';
      font-size: 18px;
    }

    footer {
      margin-top: 56px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      padding-top: 28px;
      border-top: 2px solid var(--border-light);
      animation: fadeInUp 0.6s ease-out 1s both;
    }

    footer strong {
      color: var(--text);
      font-weight: 700;
    }

    /* Mobile-First Responsive Design */
    @media (max-width: 768px) {
      body { 
        padding: 12px;
        background: linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%);
      }
      
      .container { 
        padding: 32px 24px;
        max-width: 100%;
        border-radius: 20px;
        margin: 8px;
        backdrop-filter: blur(30px);
        background: rgba(255, 255, 255, 0.98);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      }
      
      header {
        margin-bottom: 36px;
      }
      
      .logo {
        margin-bottom: 24px;
      }
      
      .logo-icon {
        width: 52px;
        height: 52px;
        font-size: 26px;
        border-radius: 14px;
      }
      
      header h1 { 
        font-size: 26px;
        margin-bottom: 10px;
      }
      
      header p { 
        font-size: 15px;
        line-height: 1.6;
        max-width: 100%;
      }
      
      .form-group {
        margin-bottom: 24px;
      }
      
      .form-control {
        padding: 15px 18px;
        font-size: 16px;
        border-width: 2px;
      }
      
      .password-toggle {
        right: 18px;
        top: 40px;
        padding: 5px;
      }
      
      .btn {
        padding: 16px 24px;
        font-size: 16px;
        border-radius: 12px;
      }
      
      .remember-forgot {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 32px;
      }
      
      .remember {
        width: 100%;
      }
      
      .forgot-link {
        align-self: flex-end;
      }
      
      .divider {
        margin: 32px 0;
      }
      
      .signup-link {
        margin-top: 28px;
        font-size: 14px;
      }
      
      footer {
        margin-top: 40px;
        padding-top: 24px;
        font-size: 12px;
      }
    }
    
    @media (max-width: 480px) {
      body { 
        padding: 8px;
      }
      
      .container { 
        padding: 28px 20px;
        border-radius: 18px;
      }
      
      .logo-icon {
        width: 48px;
        height: 48px;
        font-size: 24px;
      }
      
      header h1 { 
        font-size: 24px;
      }
      
      header p { 
        font-size: 14px;
      }
      
      .form-control {
        padding: 14px 16px;
        font-size: 15px;
      }
      
      .btn {
        padding: 15px 20px;
        font-size: 15px;
      }
      
    }
    
    @media (max-width: 360px) {
      .container { 
        padding: 24px 16px;
      }
      
      header h1 { 
        font-size: 22px;
      }
      
      .form-control {
        padding: 12px 14px;
        font-size: 14px;
      }
      
      .btn {
        padding: 14px 18px;
        font-size: 14px;
      }
      
      .remember-forgot {
        font-size: 14px;
      }
    }
    
    /* Tablet Optimization */
    @media (min-width: 769px) and (max-width: 1024px) {
      .container {
        max-width: 500px;
        padding: 48px 40px;
      }
    }
    
    /* Large Desktop Optimization */
    @media (min-width: 1440px) {
      .container {
        max-width: 500px;
        padding: 64px 56px;
      }
      
      header h1 {
        font-size: 36px;
      }
      
      header p {
        font-size: 18px;
      }
    }

    /* Loading animation */
    .loading {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      margin-right: 10px;
      vertical-align: middle;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">GED</div>
      </div>
      <h1>Welcome to GED Prep</h1>
      <p>Sign in to your real GED Prep account to access lessons, quizzes, and your learning progress.</p>
    </header>

    <div id="message" class="message"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
        <div id="emailError" class="error-message">Please enter a valid email address.</div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        <button type="button" class="password-toggle" id="passwordToggle">Show</button>
        <div id="passwordError" class="error-message">Password must be at least 8 characters.</div>
      </div>

      <div class="remember-forgot">
        <a href="reset.html" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <span id="btnText">Sign In</span>
        <div class="loading" id="loading" style="display: none;"></div>
      </button>

      <div class="signup-link">
        New to GED Prep? <a href="signup.html">Create an account</a>
      </div>
      <footer>
    © 2026 GED Prep. Form created by <strong>Aung Naing Min</strong>.
  </footer>
    </form>
  </main>

  <script>
    const loginForm=document.getElementById('loginForm'),emailInput=document.getElementById('email'),
      passwordInput=document.getElementById('password'),passwordToggle=document.getElementById('passwordToggle'),
      emailError=document.getElementById('emailError'),passwordError=document.getElementById('passwordError'),
      messageDiv=document.getElementById('message'),submitBtn=document.getElementById('submitBtn'),
      btnText=document.getElementById('btnText'),loading=document.getElementById('loading');

    function showError(el,text){el.textContent=text;el.classList.add('show');el.closest('.form-group')?.querySelector('.form-control')?.classList.add('error')}
    function hideError(el){el.classList.remove('show');el.closest('.form-group')?.querySelector('.form-control')?.classList.remove('error')}
    function showMessage(type,text){messageDiv.textContent=text;messageDiv.className='message '+type}
    function setLoading(on){btnText.style.display=on?'none':'inline';loading.style.display=on?'inline-block':'none';submitBtn.disabled=on}

    const savedEmail=localStorage.getItem('ged_user_email');
    if(savedEmail) emailInput.value=savedEmail;

    if(window.GED_AUTH_READY){
      gedSupabase.auth.getSession().then(({data})=>{
        if(data.session) window.location.replace('dashboard.html');
      });
    } else {
      showMessage('error',window.GED_AUTH_ERROR||'Authentication is not configured.');
    }

    passwordToggle.addEventListener('click',()=>{
      const type=passwordInput.type==='password'?'text':'password';
      passwordInput.type=type;passwordToggle.textContent=type==='password'?'Show':'Hide';
    });

    loginForm.addEventListener('submit',async e=>{
      e.preventDefault();hideError(emailError);hideError(passwordError);
      const email=emailInput.value.trim(),password=passwordInput.value;
      if(!email){showError(emailError,'Email is required.');return}
      if(password.length<8){showError(passwordError,'Password must be at least 8 characters.');return}
      if(!window.GED_AUTH_READY){showMessage('error',window.GED_AUTH_ERROR||'Authentication is not configured.');return}
      setLoading(true);
      const {error}=await gedSupabase.auth.signInWithPassword({email,password});
      if(error){setLoading(false);showMessage('error',error.message);return}
      localStorage.setItem('ged_user_email',email);
      window.location.replace('dashboard.html');
    });

    emailInput.addEventListener('input',()=>hideError(emailError));
    passwordInput.addEventListener('input',()=>hideError(passwordError));
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algebra — GED Math</title>
<script>MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']]}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f4f7fb;font-family:Inter,Arial,sans-serif;color:#202124}.wrap{max-width:900px;margin:auto;background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 30px #00000012;border-top:7px solid #2563eb}h1{margin:0 0 6px}.sub{color:#64748b;margin:0 0 24px}.student{margin-bottom:20px}.student input{width:100%;padding:12px;border:1px solid #dbe3ef;border-radius:8px;font-size:16px}.q{border:1px solid #e5eaf2;border-radius:12px;padding:18px;margin:14px 0;position:relative}.q.correct{border-color:#86efac;background:#f7fff9}.q.wrong{border-color:#fca5a5;background:#fffafa}.qt{font-weight:700;margin-bottom:12px}.opts{display:grid;gap:8px}.opt{padding:11px 13px;border-radius:8px;background:#f8fafc;cursor:pointer}.opt:hover{background:#eef5ff}.opt input{margin-right:8px}.submit,.btn{border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}.submit{background:#2563eb;color:#fff;width:100%;margin-top:10px}.result{display:none;text-align:center;padding:22px 0}.score{font-size:46px;font-weight:800;color:#2563eb}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{background:#16a34a;color:#fff}.btn.gray{background:#64748b}.key{display:none;margin-top:20px;border-top:2px solid #16a34a;padding-top:18px}.sol{padding:12px;border:1px solid #e5e7eb;border-radius:9px;margin:10px 0}.exp{margin-top:8px;background:#f8fafc;padding:10px;border-left:4px solid #16a34a}.badge{position:absolute;right:12px;top:12px;padding:5px 9px;border-radius:99px;color:#fff;font-size:12px}.good{background:#16a34a}.bad{background:#dc2626}@media(max-width:600px){body{padding:10px}.wrap{padding:18px}h1{font-size:24px}.q{padding:15px}.score{font-size:38px}}
</style></head>
<body><main class="wrap">
<a href="practice.html">← Math Topics</a>
<h1>Algebra</h1><p class="sub">10 GED-style questions on equations, expressions, and algebraic reasoning.</p>
<form id="quiz"><div class="student"><label><b>Student Name</b><input name="Student_Name" required placeholder="Your name"></label></div><div id="qs"></div><button class="submit">Submit Quiz</button></form>
<section class="result" id="result"><h2>Results</h2><div class="score" id="score"></div><div class="actions"><button class="btn" id="showKey" type="button">Show Solutions</button><button class="btn gray" type="button" onclick="location.reload()">Try Again</button></div></section>
<section class="key" id="key"><h2>Answer Key & Explanations</h2><div id="solutions"></div></section>
</main>
<script>
const questions=[{"q":"Solve $2x+5=17$.","o":["5","6","7","8"],"a":1,"e":"Subtract 5: $2x=12$. Divide by 2: $x=6$."},{"q":"Solve $5x-10=25$.","o":["5","6","7","8"],"a":2,"e":"Add 10: $5x=35$. Divide by 5: $x=7$."},{"q":"Simplify $3x+4x-2$.","o":["7x-2","7x+2","x-2","12x-2"],"a":0,"e":"Combine like terms: $3x+4x=7x$, so the result is $7x-2$."},{"q":"If $x=4$, find $3x^2-2$.","o":["34","42","46","50"],"a":2,"e":"$3(4^2)-2=3(16)-2=46$."},{"q":"Solve $x/4=9$.","o":["13","27","36","45"],"a":2,"e":"Multiply both sides by 4: $x=36$."},{"q":"Expand $2(3x-4)$.","o":["6x-8","6x-4","3x-8","5x-8"],"a":0,"e":"Distribute 2: $2(3x)-2(4)=6x-8$."},{"q":"Solve $4x+3=2x+15$.","o":["4","5","6","7"],"a":2,"e":"Subtract $2x$ and 3: $2x=12$, so $x=6$."},{"q":"If $a=5$ and $b=3$, find $2a+b$.","o":["10","11","13","16"],"a":2,"e":"$2(5)+3=13$."},{"q":"Solve $3(x+2)=21$.","o":["4","5","6","7"],"a":1,"e":"Divide by 3: $x+2=7$, so $x=5$."},{"q":"Evaluate $2x+1$ when $x=-3$.","o":["-7","-5","5","7"],"a":1,"e":"$2(-3)+1=-6+1=-5$."}];
const qs=document.getElementById('qs');
questions.forEach((x,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML='<div class="qt">Q'+(i+1)+'. '+x.q+'</div><div class="opts">'+x.o.map((v,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'" required> '+String.fromCharCode(65+j)+'. '+v+'</label>').join('')+'</div>';qs.appendChild(d)});
document.getElementById('quiz').addEventListener('submit',e=>{e.preventDefault();let n=0;questions.forEach((x,i)=>{const d=qs.children[i],v=d.querySelector('input:checked')?.value,b=document.createElement('span');b.className='badge '+(v==x.a?'good':'bad');b.textContent=v==x.a?'Correct':'Incorrect';d.querySelector('.badge')?.remove();d.appendChild(b);d.classList.toggle('correct',v==x.a);d.classList.toggle('wrong',v!=x.a);if(v==x.a)n++});document.getElementById('score').textContent=n+'/'+questions.length;document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';window.scrollTo({top:0,behavior:'smooth'})});
document.getElementById('showKey').onclick=()=>{const k=document.getElementById('solutions');k.innerHTML=questions.map((x,i)=>'<div class="sol"><b>Q'+(i+1)+': Answer '+String.fromCharCode(65+x.a)+'</b><div class="exp">'+x.e+'</div></div>').join('');document.getElementById('key').style.display='block';if(window.MathJax)MathJax.typesetPromise()}; 
</script></body></html>
